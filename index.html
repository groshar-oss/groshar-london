function km(a, b){ const R = 6371, t = x => x*Math.PI/180, dLa = t(b[0]-a[0]), dLo = t(b[1]-a[1]); const h = Math.sin(dLa/2)**2 + Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function travelInfo(e){
  if(!e.pl || !PL[e.pl] || e.k === "r") return null;
  const prev = E.filter(x => x !== e && x.k !== "r" && x.d === e.d && x.t < e.t && x.pl && PL[x.pl] && x.who.some(w => e.who.includes(w))).slice(-1)[0];
  if(!prev || prev.pl === e.pl) return null;
  if(["lhr","ltn"].includes(prev.pl) || ["lhr","ltn"].includes(e.pl)) return null; // airport legs are by pre-booked van
  const d = km(PL[prev.pl].ll, PL[e.pl].ll); if(d < 0.25) return null;

  return {walk, mins, from: prev, tight: gap < mins + 5};
}

function icsEsc(t){ return String(t||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\;"); }
function buildICS(id){

  const mine = E.filter(e => e.k !== "r" && e.who.includes(id)).sort((a,b) => a.d - b.d || a.t.localeCompare(b.t));

  const dt = (date, t) => date.replace(/-/g,"") + "T" + t.replace(":","") + "00Z"; // December in London = UTC
  const add = (date, t, mins) => { const d0 = new Date(date + "T" + t + ":00Z"); d0.setUTCMinutes(d0.getUTCMinutes() + mins); return d0.toISOString().replace(/[-:]/g,"").slice(0,15) + "Z"; };
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Groshar//London 2026//HE","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:" + (he ? "לונדון 2026 – " : "London 2026 – ") + nm(id)];
  mine.forEach((e, i) => {
    const date = DAYS[e.d].date, next = mine.slice(i+1).find(x => x.d === e.d && x.t > e.t);
    let mins = 90; if(next){ const [a,b] = e.t.split(":").map(Number), [c,d] = next.t.split(":").map(Number); mins = Math.max(30, Math.min(180, (c*60+d)-(a*60+b))); }
    const p = e.pl ? PL[e.pl] : null;
    lines.push("BEGIN:VEVENT", "UID:groshar-" + id + "-" + e.d + "-" + e.t.replace(":","") + "-" + i + "@groshar-london", "DTSTAMP:" + stamp,
      "DTSTART:" + dt(date, e.t), "DTEND:" + add(date, e.t, mins),

    if(p) lines.push("LOCATION:" + icsEsc(p.q || p.en), "GEO:" + p.ll[0] + ";" + p.ll[1]);

/* ============ WIRING ============ */
function wire(v){
  v.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { DAY = +b.dataset.day; renderView(); });
  v.querySelectorAll("[data-sos]").forEach(b => b.onclick = openSOS);
  v.querySelectorAll("[data-goday]").forEach(b => b.onclick = () => { DAY = +b.dataset.goday; if(SCHMODE === "attr"){ SCHMODE = "list"; store.set("gl_schmode","list"); } location.hash = "schedule"; });
  v.querySelectorAll("[data-kday]").forEach(b => b.onclick = () => { KDAY = +b.dataset.kday; renderView(); });
  v.querySelectorAll("[data-kid]").forEach(b => b.onclick = () => { KID = b.dataset.kid; store.set("gl_kid", KID); renderView(); window.scrollTo(0,0); });
  v.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { SCHMODE = b.dataset.mode; store.set("gl_schmode",SCHMODE); renderView(); });
  const as = v.querySelector("#attrSel"); if(as) as.onchange = () => { ATTR = as.value; store.set("gl_attr", ATTR); renderView(); };
  v.querySelectorAll("[data-mapmode]").forEach(b => b.onclick = () => { MAPMODE = b.dataset.mapmode; renderView(); });
  v.querySelectorAll("[data-mapday]").forEach(b => b.onclick = () => { MAPDAY = b.dataset.mapday; renderView(); });
  v.querySelectorAll("[data-cardplace]").forEach(b => b.onclick = ev => { if(ev.target.closest("a,button,select,input")) return; openPlace(b.dataset.cardplace); });
  const ig = v.querySelector("#icsGo"); if(ig) ig.onclick = () => { const id = v.querySelector("#icsMe").value; if(!id){ v.querySelector("#icsMe").focus(); return; } store.set("gl_me", id); downloadICS(id, ig); };
  v.querySelectorAll("[data-mday]").forEach(b => b.onclick = () => { MDAY = +b.dataset.mday; const box = document.querySelector("#sec-morning .in"); if(box){ box.innerHTML = morningCard(); wire(v); } else renderView(); });
  const mc = v.querySelector("#mCopy"); if(mc) mc.onclick = async () => { try{ await navigator.clipboard.writeText(morningText(MDAY)); mc.textContent = "✓"; }catch(e){ mc.textContent = "✗"; } };
  v.querySelectorAll("[data-place]").forEach(b => { b.onclick = () => openPlace(b.dataset.place); b.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openPlace(b.dataset.place); } }; });
  v.querySelectorAll("[data-pack]").forEach(c => c.onchange = () => { const s = store.get("gl_pack",{}); s[c.dataset.pack] = c.checked; store.set("gl_pack",s); c.closest(".check").classList.toggle("done",c.checked); });
  v.querySelectorAll("[data-hunt]").forEach(c => c.onchange = () => { const s = store.get("gl_hunt",{}); s[c.dataset.hunt] = c.checked; store.set("gl_hunt",s); renderView(); const d = $("sec-kids"); if(d) d.open = true; });
  v.querySelectorAll("[data-todo]").forEach(c => c.onchange = () => { DRAFT.done[c.dataset.todo] = c.checked; c.closest(".check").classList.toggle("done",c.checked); });
  v.querySelectorAll("[data-buddy]").forEach(s => s.onchange = () => { DRAFT.buddies[s.dataset.buddy] = s.value; });
  v.querySelectorAll("[data-phone]").forEach(i => i.oninput = () => { DRAFT.phones[i.dataset.phone] = i.value.trim(); });
  v.querySelectorAll("[data-card]").forEach(b => b.onclick = () => saveCard(b.dataset.card, b));
  const ah = $("annHe"), ae = $("annEn"), al = $("albumIn");
  if(ah) ah.oninput = () => { DRAFT.announce.he = ah.value; };
  if(ae) ae.oninput = () => { DRAFT.announce.en = ae.value; EN_TOUCHED = true; };
  const tb = $("transBtn"); if(tb) tb.onclick = async () => { const m = $("transMsg"); m.textContent = LANG==="he"?"מתרגם...":"Translating..."; const t = await translateHe(DRAFT.announce.he); if(t){ DRAFT.announce.en = t; EN_TOUCHED = true; const e2 = $("annEn"); if(e2) e2.value = t; m.textContent = LANG==="he"?"תורגם – אפשר לתקן לפני שמירה":"Translated – you can edit it before saving"; } else m.textContent = LANG==="he"?"התרגום לא הצליח – אפשר לכתוב באנגלית ידנית":"Translation failed – type the English yourself"; };
  if(al) al.oninput = () => { DRAFT.album = al.value.trim(); };
  const wi = $("waIn"); if(wi) wi.oninput = () => { DRAFT.waGroup = wi.value.trim(); };
  const g = $("gbp"), i = $("ils"), r = $("rate");
  if(g){ const rt = () => parseFloat(r.value)||(LANG==="he"?4.08:1.33);
    g.oninput = () => { i.value = g.value===""?"":(parseFloat(g.value)*rt()).toFixed(2); };
    i.oninput = () => { g.value = i.value===""?"":(parseFloat(i.value)/rt()).toFixed(2); };
    r.oninput = () => { store.set(LANG==="he"?"gl_rate":"gl_rate_usd", rt()); g.oninput(); }; }
  const on = $("editOn"); if(on) on.onclick = () => { EDIT = true; DRAFT = JSON.parse(JSON.stringify(STATE)); renderView(); };
  const cx = $("editCancel"); if(cx) cx.onclick = () => { EDIT = false; renderView(); };
  const sv = $("editSave"); if(sv) sv.onclick = save;
}

/* ============ SAVE (republish page with new shared state) ============ */
function buildDoc(state){
  const style = $("app-style").textContent, script = $("app-script").textContent;
  const json = JSON.stringify(state).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>'
    + HEAD_TAGS + '<style id="app-style">' + style + '</style>\n' + BODY_TAGS
    + '<script type="application/json" id="state">' + json + '<\/script>\n<script id="app-script">' + script + '<\/script></body></html>';
}
let EN_TOUCHED = false;
async function translateHe(he){
  if(!he || !he.trim()) return "";
  let sm = SAMPLE; try{ if(!sm && window.claude) sm = await window.claude.use("sample"); }catch(e){}
  if(!sm) return null;
  const names = IDS.map(i => `${P[i].he} = ${P[i].en}`).join(", ");
  try{
    const { text } = await sm(`Translate this announcement from the organizer of a family trip to London from Hebrew into natural, warm, short English for the English-speaking relatives. Use these name spellings: ${names}. Keep times, numbers, emojis and links exactly as they are. Reply with only the English translation, nothing else.\n\n${he}`, { modelTier: "quick" });
    return text.trim();
  }catch(e){ return null; }
}
async function save(){
  const msg = $("editMsg"), btn = $("editSave"); btn.disabled = true; msg.textContent = T("saving");
  DRAFT.announceDate = londonNow().date;
  if(DRAFT.announce.he !== STATE.announce.he && !EN_TOUCHED){
    msg.textContent = LANG==="he" ? "מתרגם לאנגלית..." : "Translating...";
    const t = await translateHe(DRAFT.announce.he);
    if(t === null){ msg.textContent = LANG==="he" ? "התרגום לא הצליח. כתבו את האנגלית ידנית ושמרו שוב." : "Translation failed. Type the English yourself and save again."; btn.disabled = false; EN_TOUCHED = true; return; }
    DRAFT.announce.en = t;
    msg.textContent = T("saving");
  }
  try{
    const art = window.claude ? await window.claude.use("artifact") : null;
    if(!art){ msg.textContent = T("readonly"); btn.disabled = false; return; }
    try{ sessionStorage.setItem("gl_tab", route()); }catch(e){}
    await art.publish(buildDoc(DRAFT));
  }catch(err){
    const c = err && err.code;
    if(c === "conflict") return;
    if(["not_writer","not_granted","not_declared","consent_required","capability_disabled"].includes(c)){ CANEDIT = false; EDIT = false; renderView(); const v = $("view"); v.insertAdjacentHTML("afterbegin", `<div class="notice">${T("readonly")}</div>`); return; }
    msg.textContent = T("saveFail"); btn.disabled = false;
  }
}

/* kid card -> PNG */
async function saveCard(kid, btn){
  const S = STATE, parentsOf = {imri:["yoni","dani"],dor:["dan","hadar"],niv:["dan","hadar"],raz:["dan","hadar"],ziv:["alon","liz"]};
  const c = document.createElement("canvas"); c.width = 1050; c.height = 650; const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0,0,1050,650); x.strokeStyle = "#0F1B3D"; x.lineWidth = 10; x.strokeRect(5,5,1040,640);
  x.fillStyle = "#0F1B3D"; x.fillRect(5,5,1040,120); x.fillStyle = "#D4A933"; x.font = "bold 54px Arial"; x.fillText("IF I'M LOST, PLEASE HELP", 40, 88);
  x.fillStyle = "#000"; x.font = "bold 64px Arial"; x.fillText("My name is " + P[kid].en, 40, 215);
  x.font = "36px Arial"; x.fillText("I'm staying at The Dilly hotel,", 40, 290); x.fillText("21 Piccadilly, London W1J 0BH", 40, 340);
  x.font = "bold 38px Arial"; x.fillText("Please call my parents:", 40, 420); x.font = "38px Arial";
  parentsOf[kid].forEach((p,i) => x.fillText(P[p].en + ":  " + (S.phones[p] || "_______________"), 40, 480 + i*55));
  x.font = "26px Arial"; x.fillStyle = "#555"; x.fillText("Emergency: 999", 40, 620);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  try{
    const dl = window.claude ? await window.claude.use("downloads") : null;
    if(!dl){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "emergency-card-" + P[kid].en.toLowerCase() + ".png"; document.body.appendChild(a); a.click(); a.remove(); btn.textContent = LANG==="he" ? "נשמר ✓" : "Saved ✓"; return; }
    await dl.save({filename: "emergency-card-" + P[kid].en.toLowerCase() + ".png", data: blob});
  }catch(e){
    if(e && e.message === "none"){ btn.textContent = LANG==="he" ? "אפשר לצלם את הכרטיס מסך" : "Take a screenshot of the card instead"; }
  }
}


/* ============ ASK CLAUDE ============ */
let SAMPLE = null, CHAT = [], CHATCTL = null;
function tripContext(){
  const n = londonNow();
  const ppl = IDS.map(i => `${P[i].en} (${P[i].he})${P[i].age?`, age ${P[i].age}`:""}, family: ${FAM[P[i].f].en}`).join("\n");
  const evs = E.map(e => { const pl = e.pl ? PL[e.pl] : null; const who = e.who.length === IDS.length ? "everyone" : e.who.map(i => P[i].en).join(", ");
    return `${DAYS[e.d].en} ${e.t} | ${e.ti.en} | ${e.su.en} | who: ${who}${pl?` | place: ${pl.en} (${pl.ll.join(",")})`:""}${e.k==="b"?" | BOOKED":e.k==="p"?" | NOT YET BOOKED":e.k==="f"?" | free time":""}`; }).join("\n");
  const places = Object.values(PL).map(p => `${p.en}: ${p.tEn}`).join("\n");
  const food = FOOD.map(f => `${f[0]}: ${f[2]}`).join("\n");
  return `You are the helpful assistant inside the Groshar family's London trip app (6-11 December 2026, 19 people, hotel: The Dilly, 21 Piccadilly, London W1J 0BH, breakfast included). Hanukkah is during the trip.
Current London date/time: ${n.date} ${n.time}. The viewer has selected: ${WHO}. Reply in ${LANG==="he"?"Hebrew":"English"} unless the viewer writes in another language - then reply in that language.
Keep answers short and practical, phone-friendly, no markdown tables. For directions, suggest the likely Tube/bus/walking route and say to confirm live times in Google Maps or Citymapper. You cannot browse the web; if something needs live info (opening hours, prices, weather) say so briefly. Use the trip data below as the source of truth for the schedule.

PEOPLE:
${ppl}

SCHEDULE (London time):
${evs}

PLACES & TIPS:
${places}

FOOD IDEAS:
${food}

TRANSFERS: Airport Pickups London, WhatsApp +44 7538 989360, phone +44 208 688 7744. Israel group (12): arrive LY317 Heathrow T4 Sun 20:25, meet driver at App & Private Hire Pick-Up Zone 1; return Fri pickup 05:00 to Luton for LY312 07:55. Alon's family (7): Delta 5921 lands Heathrow Sun 10:40; return pickup Fri 03:30 to Heathrow T4 for Delta 9603 06:30.
EMERGENCY: 999/112, NHS 111, Israeli Embassy 24/7 +44 7511 223617.`;
}
function renderFab(){
  if(!SAMPLE || $("fab")) return;
  document.body.insertAdjacentHTML("beforeend", `<button class="fab" id="fab" aria-label="Ask Claude">✳︎ <span id="fabTxt"></span></button>`);
  $("fab").onclick = openChat; fabLabel();
}
function fabLabel(){ const t = $("fabTxt"); if(t) t.textContent = LANG==="he" ? "שאלו את Claude" : "Ask Claude"; }
function openChat(){
  const he = LANG === "he";
  const sugs = he ? ["איך מגיעים מהמלון למצודת לונדון?","מה הלו״ז שלי מחר?","איפה אוכלים ליד קובנט גארדן עם פעוטות?","מה לעשות אם יורד גשם?"] : ["How do I get from the hotel to the Tower of London?","What's my plan tomorrow?","Where can we eat near Covent Garden with toddlers?","What can we do if it rains?"];
  $("sheet").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Ask Claude">
    <div class="row" style="justify-content:space-between"><h2>${he?"שאלו את Claude":"Ask Claude"}</h2><button class="tbtn" id="closeSheet">${T("close")}</button></div>
    <div class="chat"><div class="msgs" id="msgs"></div>
      ${CHAT.length?"":`<div class="sugs">${sugs.map(q => `<button class="chip" data-sug="${esc(q)}">${esc(q)}</button>`).join("")}</div>`}
      <div class="chatin"><textarea id="chatBox" rows="2" placeholder="${he?"כתבו שאלה...":"Type a question..."}"></textarea><button id="chatSend">${he?"שליחה":"Send"}</button></div>
      <div class="muted small">${he?"Claude מכיר את הלו״ז והמקומות של הטיול. התשובות משתמשות בחשבון Claude שלכם.":"Claude knows the trip schedule and places. Answers use your own Claude account."}</div></div>
  </div></div>`;
  $("closeSheet").onclick = () => { if(CHATCTL) CHATCTL.abort(); closeSheet(); };
  $("scrim").onclick = ev => { if(ev.target.id === "scrim"){ if(CHATCTL) CHATCTL.abort(); closeSheet(); } };
  drawMsgs();
  document.querySelectorAll("[data-sug]").forEach(b => b.onclick = () => { $("chatBox").value = b.dataset.sug; send(); });
  $("chatSend").onclick = send;
  $("chatBox").onkeydown = e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } };
  $("chatBox").focus();
}
function drawMsgs(extra){
  const box = $("msgs"); if(!box) return;
  box.innerHTML = "";
  CHAT.forEach(m => { const d = document.createElement("div"); d.className = "msg " + (m.role === "user" ? "me" : "ai"); d.textContent = m.content; box.appendChild(d); });
  if(extra){ const d = document.createElement("div"); d.className = "msg " + (extra.cls || "ai"); d.id = "live"; d.textContent = extra.text; box.appendChild(d); }
  box.scrollTop = box.scrollHeight;
}
async function send(){
  const he = LANG === "he", box = $("chatBox"), btn = $("chatSend");
  const q = box.value.trim(); if(!q || CHATCTL) return;
  box.value = ""; CHAT.push({role:"user", content:q});
  document.querySelectorAll(".sugs").forEach(x => x.remove());
  drawMsgs({text: he ? "חושב..." : "Thinking..."});
  CHATCTL = new AbortController(); btn.textContent = he ? "עצירה" : "Stop"; btn.onclick = () => CHATCTL && CHATCTL.abort();
  const turns = [{role:"user", content: tripContext()}, ...CHAT.slice(-12)];
  try{
    const { text } = await SAMPLE(turns, { cache:false, signal: CHATCTL.signal, onText: ({text}) => { const l = $("live"); if(l){ l.textContent = text; const b = $("msgs"); b.scrollTop = b.scrollHeight; } } });
    CHAT.push({role:"assistant", content:text}); drawMsgs();
  }catch(e){
    const c = e && e.code;
    if(e && e.text) CHAT.push({role:"assistant", content:e.text});
    const msg = c === "cancelled" ? "" : (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)
      ? (he ? "הצ׳אט עם Claude לא זמין בחשבון הזה." : "Claude chat isn't available for this account.")
      : c === "rate_limited" ? (he ? "יותר מדי שאלות ברצף – נסו שוב בעוד כמה דקות." : "Too many questions in a row – try again in a few minutes.")
      : c === "session_expired" ? (he ? "צריך להתחבר מחדש ל-Claude." : "Please sign in to Claude again.")
      : (he ? "משהו השתבש. נסו לשאול שוב." : "Something went wrong. Try asking again."));
    drawMsgs(msg ? {text: msg, cls:"note"} : null);
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){ SAMPLE = null; const f = $("fab"); if(f) f.remove(); }
  }finally{
    CHATCTL = null; const b = $("chatSend"); if(b){ b.textContent = he ? "שליחה" : "Send"; b.onclick = send; }
  }
}

/* ============ BOOT ============ */
try{ if(store.get("gl_big",false)) document.documentElement.classList.add("big"); }catch(e){}
try{ const t = sessionStorage.getItem("gl_tab"); if(t){ sessionStorage.removeItem("gl_tab"); if(!location.hash) location.hash = t; } }catch(e){}
window.addEventListener("hashchange", () => { closeSheet(); renderTabs(); renderView(); window.scrollTo(0,0); });
(function(){
  let sx = null, sy = 0;
  const v = $("view");
  v.addEventListener("touchstart", e => {
    sx = null;
    const kid = route() === "now" && KID && KIDS.includes(KID);
    if(!(kid || (route() === "schedule" && SCHMODE !== "attr")) || e.touches.length !== 1) return;
    if(e.target.closest(".grid-who, .days, select, input, textarea")) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive:true});
  v.addEventListener("touchend", e => {
    if(sx === null) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const next = LANG === "he" ? dx > 0 : dx < 0;
    const kid = route() === "now" && KID && KIDS.includes(KID);
    const cur = kid ? KDAY : DAY;
    const nd = Math.max(0, Math.min(DAYS.length - 1, cur + (next ? 1 : -1)));
    if(nd === cur) return;
    if(kid) KDAY = nd; else DAY = nd;
    renderView();
    const vv = $("view"); vv.style.transition = "none"; vv.style.opacity = ".35"; vv.style.transform = `translateX(${(dx > 0 ? -1 : 1) * 24}px)`;
    requestAnimationFrame(() => { vv.style.transition = "opacity .2s, transform .2s"; vv.style.opacity = "1"; vv.style.transform = "none"; });
    const days = vv.querySelector(".days [aria-pressed=\"true\"]"); if(days) days.scrollIntoView({block:"nearest", inline:"center"});
  }, {passive:true});
})();
renderAll();
loadWeather(); loadTube();
setInterval(() => { if(route() === "now") loadTube(); }, 5*60e3);
setInterval(() => { if(route() === "now" && !$("sheet").innerHTML) renderView(); }, 60000);
if("serviceWorker" in navigator && /github\.io$/.test(location.hostname)){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
(async () => {
  try{
    for(let i = 0; i < 30 && !window.claude; i++) await new Promise(r => setTimeout(r, 100));
    if(!window.claude) return;
    window.claude.use("sample").then(sm => { if(sm){ SAMPLE = sm; renderFab(); } }).catch(() => {});
    const u = await window.claude.use("user");
    const ok = u ? await Promise.resolve(u.canEdit()) : false;
    if(ok){ CANEDIT = true; const r = route(); if(r === "more" || r === "bookings") renderView(); }
  }catch(e){}
})();
})();
